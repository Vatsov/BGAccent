[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bgaccent"
version = "0.1.0"
description = "Pre-TTS QA tool for Bulgarian text — automatic accent placement"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "marisa-trie>=1.1",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
nlp = ["spacy>=3.7"]

[project.scripts]
bgaccent = "bgaccent.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["marisa_trie", "bgaccent_data_full_gpl", "spacy", "spacy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bgaccent"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
